<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("souschef.theme");
          var dark = pref === "dark" || (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/gio-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffbe0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cook with Gio" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cook with Gio — your AI cooking sidekick</title>
    <meta name="description" content="Ask the AI chef for any recipe, cook it step by step, and earn XP, streaks and badges with Chef Gio." />
    <!-- Social cards — swap og:url/og:image for absolute URLs once the production domain is known (most scrapers require them absolute). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cook with Gio — your AI cooking sidekick" />
    <meta property="og:description" content="Ask the AI chef for any recipe, cook it step by step, and earn XP, streaks and badges with Chef Gio." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cook with Gio — your AI cooking sidekick" />
    <meta name="twitter:description" content="Ask the AI chef for any recipe, cook it step by step, and earn XP, streaks and badges with Chef Gio." />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
